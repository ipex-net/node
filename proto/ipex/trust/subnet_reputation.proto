syntax = "proto3";
package ipex.trust;

option go_package = "ipex/x/trust/types";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

message SubnetReputation {
  uint64 index = 1; 
  uint64 level1Count = 2; 
  uint64 level2Count = 3; 
  uint64 level3Count = 4; 
  uint64 level4Count = 5; 
  google.protobuf.Timestamp lastUpdated = 6 [(gogoproto.stdtime) = true];
}

