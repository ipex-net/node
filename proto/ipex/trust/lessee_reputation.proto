syntax = "proto3";
package ipex.trust;

option go_package = "ipex/x/trust/types";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

message LesseeReputation {
  uint64 index = 1; 
  int32 level1Count = 2; 
  int32 level2Count = 3; 
  int32 level3Count = 4; 
  int32 level4Count = 5; 
  google.protobuf.Timestamp lastUpdated = 6 [(gogoproto.stdtime) = true];
  uint64 abuseResolved = 7;
  uint64 abuseFailed = 8;
  uint64 abuseInProgress = 9;
  map<uint32, AbuseTypeStats> abuseByType = 10; 
}

message AbuseTypeStats {
  uint64 resolved = 1;
  uint64 failed = 2;
  uint64 inProgress = 3;
  google.protobuf.Timestamp lastIncident = 4 [(gogoproto.stdtime) = true];
}