syntax = "proto3";

package ipex.trust;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "ipex/trust/params.proto";
import "ipex/trust/subnet_reputation.proto";
import "ipex/trust/blacklist_log.proto";

option go_package = "ipex/x/trust/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/ipex/trust/params";
  
  }
  
  // Queries a list of SubnetReputation items.
  rpc SubnetReputation    (QueryGetSubnetReputationRequest) returns (QueryGetSubnetReputationResponse) {
    option (google.api.http).get = "/ipex/trust/subnet_reputation/{index}";
  
  }
  rpc SubnetReputationAll (QueryAllSubnetReputationRequest) returns (QueryAllSubnetReputationResponse) {
    option (google.api.http).get = "/ipex/trust/subnet_reputation";
  
  }
  
  // Queries a list of BlacklistLog items.
  rpc BlacklistLog    (QueryGetBlacklistLogRequest) returns (QueryGetBlacklistLogResponse) {
    option (google.api.http).get = "/ipex/trust/blacklist_log/{id}";
  
  }
  rpc BlacklistLogAll (QueryAllBlacklistLogRequest) returns (QueryAllBlacklistLogResponse) {
    option (google.api.http).get = "/ipex/trust/blacklist_log";
  
  }
  
  // Queries a list of BlacklistLogBySubnet items.
  rpc BlacklistLogBySubnet (QueryBlacklistLogBySubnetRequest) returns (QueryBlacklistLogBySubnetResponse) {
    option (google.api.http).get = "/ipex/trust/blacklist_log_by_subnet/{subnetId}";
  
  }
  
  // Queries a list of BlacklistLogByLessor items.
  rpc BlacklistLogByLessor (QueryBlacklistLogByLessorRequest) returns (QueryBlacklistLogByLessorResponse) {
    option (google.api.http).get = "/ipex/trust/blacklist_log_by_lessor/{lessorOrgId}";
  
  }
  
  // Queries a list of BlacklistLogByLease items.
  rpc BlacklistLogByLease (QueryBlacklistLogByLeaseRequest) returns (QueryBlacklistLogByLeaseResponse) {
    option (google.api.http).get = "/ipex/trust/blacklist_log_by_lease/{leaseId}";
  
  }
  
  // Queries a list of BlacklistLogByLessee items.
  rpc BlacklistLogByLessee (QueryBlacklistLogByLesseeRequest) returns (QueryBlacklistLogByLesseeResponse) {
    option (google.api.http).get = "/ipex/trust/blacklist_log_by_lessee/{lesseeOrgId}";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryGetSubnetReputationRequest {
  uint64 index = 1;
}

message QueryGetSubnetReputationResponse {
  SubnetReputation subnetReputation = 1 [(gogoproto.nullable) = false];
}

message QueryAllSubnetReputationRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllSubnetReputationResponse {
  repeated SubnetReputation                       subnetReputation = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination       = 2;
}

message QueryGetBlacklistLogRequest {
  uint64 id = 1;
}

message QueryGetBlacklistLogResponse {
  BlacklistLog BlacklistLog = 1 [(gogoproto.nullable) = false];
}

message QueryAllBlacklistLogRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllBlacklistLogResponse {
  repeated BlacklistLog                           BlacklistLog = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse          pagination   = 2;
}

message QueryBlacklistLogBySubnetRequest {
  uint64                                subnetId   = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryBlacklistLogBySubnetResponse {
  repeated BlacklistLog                  BlacklistLog = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination   = 2;
}

message QueryBlacklistLogByLessorRequest {
  uint64 lessorOrgId = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryBlacklistLogByLessorResponse {
  repeated BlacklistLog                  BlacklistLog = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination   = 2;
}

message QueryBlacklistLogByLeaseRequest {
  uint64 leaseId = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryBlacklistLogByLeaseResponse {
  repeated BlacklistLog                  BlacklistLog = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination   = 2;
}

message QueryBlacklistLogByLesseeRequest {
  uint64 lesseeOrgId = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryBlacklistLogByLesseeResponse {
  repeated BlacklistLog                  BlacklistLog = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination   = 2;
}

