syntax = "proto3";

package ipex.org;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "ipex/org/params.proto";
import "ipex/org/org.proto";

option go_package = "ipex/x/org/types";

// GenesisState defines the org module's genesis state.
message GenesisState {
  
  // params defines all the parameters of the module.
           Params params   = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
  repeated Org    orgList  = 2 [(gogoproto.nullable) = false] ;
           uint64 orgCount = 3;
}

