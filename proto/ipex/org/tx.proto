syntax = "proto3";

package ipex.org;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "ipex/org/params.proto";

option go_package = "ipex/x/org/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  
  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams   (MsgUpdateParams  ) returns (MsgUpdateParamsResponse  );
  rpc RegisterOrg    (MsgRegisterOrg   ) returns (MsgRegisterOrgResponse   );
  rpc UpdateOrg      (MsgUpdateOrg     ) returns (MsgUpdateOrgResponse     );
  rpc DeleteOrg      (MsgDeleteOrg     ) returns (MsgDeleteOrgResponse     );
  rpc ChangeOrgAdmin (MsgChangeOrgAdmin) returns (MsgChangeOrgAdminResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) =                   "authority";
  option           (amino.name) = "ipex/x/org/MsgUpdateParams";
  
  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

message MsgRegisterOrg {
  option (cosmos.msg.v1.signer) = "creator";
  string creator            =  1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string name               =  2;
  string legalName          =  3;
  string address            =  4;
  string registrationNumber =  5;
  string countryCode        =  6;
  string taxId              =  7;
  string website            =  8;
  string abuseEmail         =  9;
  string contactEmail       = 10;
}

message MsgRegisterOrgResponse {
  uint64 id = 1;
}

message MsgUpdateOrg {
  option (cosmos.msg.v1.signer) = "creator";
  string creator            =  1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id                 =  2;
  string name               =  3;
  string legalName          =  4;
  string address            =  5;
  string registrationNumber =  6;
  string countryCode        =  7;
  string taxId              =  8;
  string website            =  9;
  string abuseEmail         = 10;
  string contactEmail       = 11;
}

message MsgUpdateOrgResponse {}

message MsgDeleteOrg {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 id      = 2;
}

message MsgDeleteOrgResponse {}

message MsgChangeOrgAdmin {
  option (cosmos.msg.v1.signer) = "creator";
  string creator  = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 orgId    = 2;
  string newAdmin = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"];
}

message MsgChangeOrgAdminResponse {}

