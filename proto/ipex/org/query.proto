syntax = "proto3";

package ipex.org;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "ipex/org/params.proto";
import "ipex/org/org.proto";

option go_package = "ipex/x/org/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/ipex/org/params";
  
  }
  
  // Queries a list of Org items.
  rpc Org    (QueryGetOrgRequest) returns (QueryGetOrgResponse) {
    option (google.api.http).get = "/ipex/org/org/{id}";
  
  }
  rpc OrgAll (QueryAllOrgRequest) returns (QueryAllOrgResponse) {
    option (google.api.http).get = "/ipex/org/org";
  
  }
  
  // Queries a list of ShowOrg items.
  rpc ShowOrg (QueryShowOrgRequest) returns (QueryShowOrgResponse) {
    option (google.api.http).get = "/ipex/org/show_org/{id}";
  
  }
  
  // Queries a list of ListOrg items.
  rpc ListOrg (QueryListOrgRequest) returns (QueryListOrgResponse) {
    option (google.api.http).get = "/ipex/org/list_org";
  
  }
  
  // Queries org by admin
  rpc OrgByAdmin (QueryOrgByAdminRequest) returns (QueryOrgByAdminResponse) {
    option (google.api.http).get = "/ipex/org/org_by_admin/{admin}";
  
  }
  
  // Queries org by creator
  rpc OrgByCreator (QueryOrgByCreatorRequest) returns (QueryOrgByCreatorResponse) {
    option (google.api.http).get = "/ipex/org/org_by_creator/{creator}";
  
  }
  
  // Queries a list of GetUserOrgRole items.
  rpc GetUserOrgRole (QueryGetUserOrgRoleRequest) returns (QueryGetUserOrgRoleResponse) {
    option (google.api.http).get = "/ipex/org/get_user_org_role/{address}";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryGetOrgRequest {
  uint64 id = 1;
}

message QueryGetOrgResponse {
  Org Org = 1 [(gogoproto.nullable) = false];
}

message QueryAllOrgRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllOrgResponse {
  repeated Org                                    Org        = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryShowOrgRequest {
  uint64 id = 1;
}

message QueryShowOrgResponse {
  Org org = 1 [(gogoproto.nullable) = false];
}

message QueryListOrgRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryListOrgResponse {
  repeated Org                                    org        = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOrgByAdminRequest {
  string                                admin      = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryOrgByAdminResponse {
  Org                                    Org        = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryOrgByCreatorRequest {
  string                                creator    = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryOrgByCreatorResponse {
  Org                                    Org        = 1;
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetUserOrgRoleRequest {
  string address   = 1;
}

message QueryGetUserOrgRoleResponse {
  uint64 orgId = 1;
  string legalName = 2;
  bool   isCreator = 3;
  bool   isAdmin   = 4;
}

