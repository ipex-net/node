syntax = "proto3";
package ipex.org;

import "cosmos_proto/cosmos.proto";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto"; 
option go_package = "ipex/x/org/types";

message Org {
  uint64 id = 1;
  string creator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string admin = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"]; 
  string treasury = 4 [(cosmos_proto.scalar) = "cosmos.AddressString"]; 
  string name = 5; 
  string legalName = 6; 
  string address = 7; 
  string registrationNumber = 8; 
  string countryCode = 9; 
  string taxId = 10; 
  string website = 11; 
  string abuseEmail = 12; 
  string contactEmail = 13; 
  bool domainVerified = 14;
  google.protobuf.Timestamp domainVerifiedAt = 15 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp domainVerifAttemptedAt = 16 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp createdAt = 17 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp updatedAt = 18 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}
