syntax = "proto3";
package ipex.org;

import "cosmos_proto/cosmos.proto";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto"; 
option go_package = "ipex/x/org/types";

message Org {
  uint64 id = 1;
  string creator = 2 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  string admin = 3 [(cosmos_proto.scalar) = "cosmos.AddressString"]; 
  string name = 4; 
  string legalName = 5; 
  string address = 6; 
  string registrationNumber = 7; 
  string countryCode = 8; 
  string taxId = 9; 
  string website = 10; 
  string abuseEmail = 11; 
  string contactEmail = 12; 
  bool verified = 13;
  string treasury = 14 [(cosmos_proto.scalar) = "cosmos.AddressString"]; 
  google.protobuf.Timestamp createdAt = 15 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp updatedAt = 16 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}
