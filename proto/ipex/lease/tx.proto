syntax = "proto3";

package ipex.lease;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "ipex/lease/params.proto";
import "cosmos/base/v1beta1/coin.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "ipex/lease/contract.proto";

option go_package = "ipex/x/lease/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  
  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams      (MsgUpdateParams     ) returns (MsgUpdateParamsResponse     );
  rpc CreateContract    (MsgCreateContract   ) returns (MsgCreateContractResponse   );
  rpc UpdateContract    (MsgUpdateContract   ) returns (MsgUpdateContractResponse   );
  rpc DeleteContract    (MsgDeleteContract   ) returns (MsgDeleteContractResponse   );
  rpc CancelContract    (MsgCancelContract   ) returns (MsgCancelContractResponse   );
  rpc RevokeContract    (MsgRevokeContract   ) returns (MsgRevokeContractResponse   );
  rpc EnrollContract    (MsgEnrollContract   ) returns (MsgEnrollContractResponse   );
  rpc TerminateContract (MsgTerminateContract) returns (MsgTerminateContractResponse);
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) =                     "authority";
  option           (amino.name) = "ipex/x/lease/MsgUpdateParams";
  
  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

message MsgCreateContract {
  option (cosmos.msg.v1.signer) = "creator";
  string                   creator          = 1 [(cosmos_proto.scalar)   = "cosmos.AddressString"] ;
  uint64                   ownerOrg         = 2;
  cosmos.base.v1beta1.Coin price            = 3 [(gogoproto.nullable)    = false                 ] ;
  cosmos.base.v1beta1.Coin safetyDeposit    = 4 [(gogoproto.nullable)    = false                 ] ;
  google.protobuf.Duration revocationPeriod = 5 [(gogoproto.stdduration) = true                  , (gogoproto.nullable) = false];
  uint64                   subnetId         = 6;
}

message MsgCreateContractResponse {
  uint64 id = 1;
}

message MsgUpdateContract {
  option (cosmos.msg.v1.signer) = "creator";
  string                   creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  cosmos.base.v1beta1.Coin price   = 2 [(gogoproto.nullable)  = false                 ];
  uint64                   id      = 3;
}

message MsgUpdateContractResponse {}

message MsgDeleteContract {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id      = 2;
}

message MsgDeleteContractResponse {}

message MsgCancelContract {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id      = 2;
}

message MsgCancelContractResponse {}

message MsgRevokeContract {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];
  uint64 id      = 2;
}

message MsgRevokeContractResponse {}

message MsgEnrollContract {
  option (cosmos.msg.v1.signer) = "creator";
  string creator   = 1;
  uint64 contract  = 2;
  uint64 lesseeOrg = 3;
}

message MsgEnrollContractResponse {}

message MsgTerminateContract {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 id      = 2;
}

message MsgTerminateContractResponse {}

