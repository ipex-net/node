syntax = "proto3";

package ipex.lease;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "ipex/lease/params.proto";
import "ipex/lease/contract.proto";
import "ipex/lease/bid.proto";

option go_package = "ipex/x/lease/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/ipex/lease/params";
  
  }
  
  // Queries a list of ShowContract items.
  rpc ShowContract (QueryShowContractRequest) returns (QueryShowContractResponse) {
    option (google.api.http).get = "/ipex/lease/show_contract/{id}";
  
  }
  
  // Queries a list of ListContract items.
  rpc ListContract (QueryListContractRequest) returns (QueryListContractResponse) {
    option (google.api.http).get = "/ipex/lease/list_contract";
  
  }
  
  // Queries a list of Bid items.
  rpc Bid (QueryGetBidRequest) returns (QueryGetBidResponse) {
    option (google.api.http).get = "/ipex/lease/bid/{contractId}/{bidderOrgId}";
  
  }
  
  // Queries a list of CanTerminateLeaseWithoutPenalty items.
  rpc CanTerminateLeaseWithoutPenalty (QueryCanTerminateLeaseWithoutPenaltyRequest) returns (QueryCanTerminateLeaseWithoutPenaltyResponse) {
    option (google.api.http).get = "/ipex/lease/can_terminate_lease_without_penalty/{contractId}";
  
  }
  
  // Queries a list of BidByContract items.
  rpc BidByContract (QueryBidByContractRequest) returns (QueryBidByContractResponse) {
    option (google.api.http).get = "/ipex/lease/bid_by_contract/{contractId}";
  
  }
  
  // Queries a list of BidByBidder items.
  rpc BidByBidder (QueryBidByBidderRequest) returns (QueryBidByBidderResponse) {
    option (google.api.http).get = "/ipex/lease/bid_by_bidder/{bidderOrgId}";
  
  }
  
  // Queries a list of BidByLessor items.
  rpc BidByLessor (QueryBidByLessorRequest) returns (QueryBidByLessorResponse) {
    option (google.api.http).get = "/ipex/lease/bid_by_lessor/{lessorOrgId}";
  
  }
  
  // Queries a list of MarketplaceContract items.
  rpc MarketplaceContract (QueryMarketplaceContractRequest) returns (QueryMarketplaceContractResponse) {
    option (google.api.http).get = "/ipex/lease/marketplace_contract/{mask}/{rir}/{country}/{minprice}/{maxprice}/{networkAddress}/{firstOctet}";
  
  }
  
  // Queries a list of ListContractFiltered items.
  rpc ListContractFiltered (QueryListContractFilteredRequest) returns (QueryListContractFilteredResponse) {
    option (google.api.http).get = "/ipex/lease/list_contract_filtered/{ownerOrg}/{lesseeOrg}/{mask}/{rir}/{country}/{minPrice}/{maxPrice}/{networkAddress}/{firstOctet}/{status}/{revocationPeriodMonth}/{createdAtFrom}/{createdAtTo}/{activatedAtFrom}/{activatedAtTo}/{prepaidUntilFrom}/{prepaidUntilTo}/{updatedAtFrom}/{updatedAtTo}";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryShowContractRequest {
  uint64 id = 1;
}

message QueryShowContractResponse {
  Contract contract = 1 [(gogoproto.nullable) = false];
}

message QueryListContractRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryListContractResponse {
  repeated Contract                               contract   = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryGetBidRequest {
  uint64 contractId  = 1;
  uint64 bidderOrgId = 2;
}

message QueryGetBidResponse {
  Bid bid = 1 [(gogoproto.nullable) = false];
}

message QueryCanTerminateLeaseWithoutPenaltyRequest {
  uint64 contractId = 1;
}

message QueryCanTerminateLeaseWithoutPenaltyResponse {
  bool eligible = 1;
}

message QueryBidByContractRequest {
  uint64                                contractId = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryBidByContractResponse {
  repeated Bid                                    bid        = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryBidByBidderRequest {
  uint64                                bidderOrgId = 1;
  cosmos.base.query.v1beta1.PageRequest pagination  = 2;
}

message QueryBidByBidderResponse {
  repeated Bid                                    bid        = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryBidByLessorRequest {
  uint64                                lessorOrgId = 1;
  cosmos.base.query.v1beta1.PageRequest pagination  = 2;
}

message QueryBidByLessorResponse {
  repeated Bid                                    bid        = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryMarketplaceContractRequest {
  uint64                                mask           = 1;
  string                                rir            = 2;
  string                                country        = 3;
  uint64                                minprice       = 4;
  uint64                                maxprice       = 5;
  uint64                                networkAddress = 6;
  uint64                                firstOctet     = 7;
  cosmos.base.query.v1beta1.PageRequest pagination     = 8;
}

message QueryMarketplaceContractResponse {
  repeated Contract                               contract   = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryListContractFilteredRequest {
  uint64                                ownerOrg              =  1 [(gogoproto.nullable) = false];
  uint64                                lesseeOrg             =  2;
  uint64                                mask                  =  3;
  string                                rir                   =  4;
  string                                country               =  5;
  uint64                                minPrice              =  6;
  uint64                                maxPrice              =  7;
  uint64                                networkAddress        =  8;
  uint64                                firstOctet            =  9;
  uint64                                status                = 10;
  uint64                                revocationPeriodMonth = 11;
  uint64                                createdAtFrom         = 12;
  uint64                                createdAtTo           = 13;
  uint64                                activatedAtFrom       = 14;
  uint64                                activatedAtTo         = 15;
  uint64                                prepaidUntilFrom      = 16;
  uint64                                prepaidUntilTo        = 17;
  uint64                                updatedAtFrom         = 18;
  uint64                                updatedAtTo           = 19;
  cosmos.base.query.v1beta1.PageRequest pagination            = 20;
}

message QueryListContractFilteredResponse {
  repeated  Contract                               contract   = 1 [(gogoproto.nullable) = false];
            cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

