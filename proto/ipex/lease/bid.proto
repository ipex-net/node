syntax = "proto3";
package ipex.lease;

option go_package = "ipex/x/lease/types";
import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "gogoproto/gogo.proto"; 
import "cosmos/base/v1beta1/coin.proto"; 

enum BidStatus {
  BID_STATUS_SUBMITTED = 0;
  BID_STATUS_ACCEPTED  = 1;
  BID_STATUS_REVOKED  = 2;
  BID_STATUS_REJECTED  = 3;
  BID_STATUS_EXPIRED   = 4;
}

message Bid {
  uint64 index = 1; 
  uint64 contractId = 2; 
  uint64 ownerOrgId = 3;
  uint64 bidderOrgId = 4; 
  string intendedUse = 5; 
  BidStatus status = 6; 
  google.protobuf.Timestamp createdAt = 7 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false ]; 
  google.protobuf.Timestamp updatedAt = 8 [(gogoproto.stdtime) = true ]; 
  uint64 expirationHours = 9; 
  cosmos.base.v1beta1.Coin amount = 10 [(gogoproto.nullable) = false];
}

