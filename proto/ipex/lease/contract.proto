syntax = "proto3";
package ipex.lease;

option go_package = "ipex/x/lease/types";
import "gogoproto/gogo.proto"; 
import "cosmos/base/v1beta1/coin.proto"; 
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";


enum ContractStatus {
  CONTRACT_STATUS_PENDING = 0;
  CONTRACT_STATUS_FORSALE = 1;
  CONTRACT_STATUS_LEASED = 2;
  CONTRACT_STATUS_CANCELED_OWNER = 3;
  CONTRACT_STATUS_CANCELED_LESSEE = 4;
  CONTRACT_STATUS_TERMINATED = 5;
  CONTRACT_STATUS_EXPIRED = 6;
}

enum PriceAdjustement {
  PRICE_ADJUSTEMENT_NONE = 0;
  PRICE_ADJUSTEMENT_MONTHLY = 1;
  PRICE_ADJUSTEMENT_QUARTERLY = 2;
  PRICE_ADJUSTEMENT_SEMIANNUALLY = 3;
  PRICE_ADJUSTEMENT_ANNUALLY = 4;
}


message Contract {
  uint64 id = 1; 
  uint64 subnetId = 2;
  uint64 ownerOrg = 3; 
  uint64 lesseeOrg = 4; 
  cosmos.base.v1beta1.Coin price = 5 [(gogoproto.nullable) = false]; 
  PriceAdjustement priceAdjustementType = 6;
  google.protobuf.Timestamp nextPricedAdjustement = 7;
  cosmos.base.v1beta1.Coin safetyDeposit = 8 [(gogoproto.nullable) = false]; 
  cosmos.base.v1beta1.Coin safetyDepositRetained = 9 [(gogoproto.nullable) = false]; 
  google.protobuf.Duration cancellationNoticePeriod = 10; 
  google.protobuf.Timestamp cancellationNoticeSentAt = 11; 
  ContractStatus status = 12; 
  google.protobuf.Timestamp createdAt = 13; 
  google.protobuf.Timestamp activatedAt = 14; 
  google.protobuf.Timestamp prepaidUntil = 15; 
  google.protobuf.Timestamp updatedAt = 16;
}
