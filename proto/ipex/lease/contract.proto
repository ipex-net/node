syntax = "proto3";
package ipex.lease;

option go_package = "ipex/x/lease/types";
import "gogoproto/gogo.proto"; 
import "cosmos/base/v1beta1/coin.proto"; 
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";


enum ContractStatus {
  CONTRACT_STATUS_FORSALE = 0;
  CONTRACT_STATUS_LEASED = 1;
  CONTRACT_STATUS_CANCELED_OWNER = 2;
  CONTRACT_STATUS_CANCELED_LESSEE = 3;
  CONTRACT_STATUS_TERMINATED = 4;
  CONTRACT_STATUS_EXPIRED = 5;
}

enum PriceAdjustement {
  PRICE_ADJUSTEMENT_NONE = 0;
  PRICE_ADJUSTEMENT_MONTHLY = 1;
  PRICE_ADJUSTEMENT_QUARTERLY = 2;
  PRICE_ADJUSTEMENT_SEMIANNUALLY = 3;
  PRICE_ADJUSTEMENT_ANNUALLY = 4;
}


message Contract {
  uint64 id = 1; 
  uint64 subnetId = 2;
  uint64 ownerOrg = 3; 
  uint64 lesseeOrg = 4; 
  cosmos.base.v1beta1.Coin price = 5 [(gogoproto.nullable) = false]; 
  PriceAdjustement priceAdjustementType = 6;
  google.protobuf.Timestamp nextPricedAdjustement = 7 [(gogoproto.stdtime) = true];
  cosmos.base.v1beta1.Coin safetyDeposit = 8 [(gogoproto.nullable) = true]; 
  cosmos.base.v1beta1.Coin safetyDepositRetained = 9; 
  google.protobuf.Duration revocationPeriod = 10 [(gogoproto.stdduration) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp revocationEffectiveAt = 11 [(gogoproto.stdtime) = true, (gogoproto.nullable) = true]; 
  ContractStatus status = 12; 
  google.protobuf.Timestamp createdAt = 13 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp activatedAt = 14 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp prepaidUntil = 15 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp updatedAt = 16 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}
