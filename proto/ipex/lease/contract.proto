syntax = "proto3";
package ipex.lease;

option go_package = "ipex/x/lease/types";
import "gogoproto/gogo.proto"; 
import "cosmos/base/v1beta1/coin.proto"; 
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";


enum ContractStatus {
  CONTRACT_STATUS_FORSALE = 0;
  CONTRACT_STATUS_LEASED = 1;
  CONTRACT_STATUS_CANCELED_OWNER = 2;
  CONTRACT_STATUS_CANCELED_LESSEE = 3;
  CONTRACT_STATUS_TERMINATED = 4;
  CONTRACT_STATUS_EXPIRED = 5;
  CONTRACT_STATUS_REFUNDED = 6; 
}

message Contract {
  uint64 id = 1; 
  uint64 subnetId = 2;
  uint64 ownerOrg = 3; 
  uint64 lesseeOrg = 4; 
  cosmos.base.v1beta1.Coin price = 5 [(gogoproto.nullable) = false]; 
  cosmos.base.v1beta1.Coin safetyDeposit = 6 [(gogoproto.nullable) = false]; 
  cosmos.base.v1beta1.Coin safetyDepositRetained = 7; 
  google.protobuf.Duration revocationPeriod = 8 [(gogoproto.stdduration) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp revocationEffectiveAt = 9 [(gogoproto.stdtime) = true, (gogoproto.nullable) = true]; 
  ContractStatus status = 10; 
  google.protobuf.Timestamp createdAt = 11 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp activatedAt = 12 [(gogoproto.stdtime) = true, (gogoproto.nullable) = true]; 
  google.protobuf.Timestamp prepaidUntil = 13 [(gogoproto.stdtime) = true, (gogoproto.nullable) = true]; 
  google.protobuf.Timestamp updatedAt = 14 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}
