syntax = "proto3";

package ipex.payments;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "ipex/payments/params.proto";
import "ipex/payments/transaction.proto";

option go_package = "ipex/x/payments/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/ipex/payments/params";
  
  }
  
  // Queries a list of Transaction items.
  rpc Transaction    (QueryGetTransactionRequest) returns (QueryGetTransactionResponse) {
    option (google.api.http).get = "/ipex/payments/transaction/{id}";
  
  }
  rpc TransactionAll (QueryAllTransactionRequest) returns (QueryAllTransactionResponse) {
    option (google.api.http).get = "/ipex/payments/transaction";
  
  }
  
  // Queries a list of ListContractPayment items.
  rpc ListContractPayment (QueryListContractPaymentRequest) returns (QueryListContractPaymentResponse) {
    option (google.api.http).get = "/ipex/payments/list_contract_payment/{id}";
  
  }
  
  // Queries a list of ListPaymentFiltered items.
  rpc ListPaymentFiltered (QueryListPaymentFilteredRequest) returns (QueryListPaymentFilteredResponse) {
    option (google.api.http).get = "/ipex/payments/list_payment_filtered/{orgId}/{transactionType}/{moduleId}/{fromTimestamp}/{toTimestamp}/{minAmount}/{maxAmount}";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryGetTransactionRequest {
  uint64 id = 1;
}

message QueryGetTransactionResponse {
  Transaction Transaction = 1 [(gogoproto.nullable) = false];
}

message QueryAllTransactionRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllTransactionResponse {
  repeated Transaction                            Transaction = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination  = 2;
}

message QueryListContractPaymentRequest {
  uint64                                id         = 1;
  cosmos.base.query.v1beta1.PageRequest pagination = 2;
}

message QueryListContractPaymentResponse {
  repeated Transaction                            transaction = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination  = 2;
}

message QueryListPaymentFilteredRequest {
  uint64                                orgId           = 1;
  uint64                                transactionType = 2;
  uint64                                moduleId        = 3;
  uint64                                fromTimestamp   = 4;
  uint64                                toTimestamp     = 5;
  uint64                                minAmount       = 6;
  uint64                                maxAmount       = 7;
  cosmos.base.query.v1beta1.PageRequest pagination      = 8;
}

message QueryListPaymentFilteredResponse {
  repeated  Transaction                             transaction = 1 [(gogoproto.nullable) = false];
            cosmos.base.query.v1beta1.PageResponse  pagination  = 2;
}

