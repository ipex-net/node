syntax = "proto3";

package ipex.subnet;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "ipex/subnet/params.proto";
import "ipex/subnet/subnet.proto";

option go_package = "ipex/x/subnet/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/ipex/subnet/params";
  
  }
  
  // Queries a list of Subnet items.
  rpc Subnet    (QueryGetSubnetRequest) returns (QueryGetSubnetResponse) {
    option (google.api.http).get = "/ipex/subnet/subnet/{id}";
  
  }
  rpc SubnetAll (QueryAllSubnetRequest) returns (QueryAllSubnetResponse) {
    option (google.api.http).get = "/ipex/subnet/subnet";
  
  }
  
  // Queries a list of ListSubnet items.
  rpc ListSubnet (QueryListSubnetRequest) returns (QueryListSubnetResponse) {
    option (google.api.http).get = "/ipex/subnet/list_subnet";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryGetSubnetRequest {
  uint64 id = 1;
}

message QueryGetSubnetResponse {
  Subnet Subnet = 1 [(gogoproto.nullable) = false];
}

message QueryAllSubnetRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllSubnetResponse {
  repeated Subnet                                 Subnet     = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryListSubnetRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryListSubnetResponse {
  repeated Subnet subnet = 1 [(gogoproto.nullable) = false];
  cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

