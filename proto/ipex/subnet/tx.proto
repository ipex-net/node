syntax = "proto3";

package ipex.subnet;

import "amino/amino.proto";
import "cosmos/msg/v1/msg.proto";
import "cosmos_proto/cosmos.proto";
import "gogoproto/gogo.proto";
import "ipex/subnet/params.proto";

option go_package = "ipex/x/subnet/types";

// Msg defines the Msg service.
service Msg {
  option (cosmos.msg.v1.service) = true;
  
  // UpdateParams defines a (governance) operation for updating the module
  // parameters. The authority defaults to the x/gov module account.
  rpc UpdateParams        (MsgUpdateParams       ) returns (MsgUpdateParamsResponse       );
  rpc CreateSubnet        (MsgCreateSubnet       ) returns (MsgCreateSubnetResponse       );
  rpc UpdateSubnetUser    (MsgUpdateSubnetUser   ) returns (MsgUpdateSubnetUserResponse   );
  rpc UpdateSubnetGeofeed (MsgUpdateSubnetGeofeed) returns (MsgUpdateSubnetGeofeedResponse);
  rpc RemoveSubnetUser    (MsgRemoveSubnetUser   ) returns (MsgRemoveSubnetUserResponse   );
}
// MsgUpdateParams is the Msg/UpdateParams request type.
message MsgUpdateParams {
  option (cosmos.msg.v1.signer) =                      "authority";
  option           (amino.name) = "ipex/x/subnet/MsgUpdateParams";
  
  // authority is the address that controls the module (defaults to x/gov unless overwritten).
  string authority = 1 [(cosmos_proto.scalar) = "cosmos.AddressString"];

  // params defines the module parameters to update.
  
  // NOTE: All parameters must be supplied.
  Params params = 2 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

// MsgUpdateParamsResponse defines the response structure for executing a
// MsgUpdateParams message.
message MsgUpdateParamsResponse {}

message MsgCreateSubnet {
  option (cosmos.msg.v1.signer) = "creator";
  string creator        = 1;
  uint64 ownerOrgId     = 2;
  uint64 networkAddress = 3;
  uint64 mask           = 4;
  string geofeedUrl     = 5;
  uint64 rir            = 6;
}

message MsgCreateSubnetResponse {
  uint64 id = 1;
}

message MsgUpdateSubnetUser {
  option (cosmos.msg.v1.signer) = "creator";
  string creator   = 1;
  uint64 id        = 2;
  uint64 userOrgId = 3;
}

message MsgUpdateSubnetUserResponse {}

message MsgUpdateSubnetGeofeed {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 id      = 2;
  string geofeed = 3;
}

message MsgUpdateSubnetGeofeedResponse {}

message MsgRemoveSubnetUser {
  option (cosmos.msg.v1.signer) = "creator";
  string creator = 1;
  uint64 id      = 2;
}

message MsgRemoveSubnetUserResponse {}

