syntax = "proto3";
package ipex.subnet;

option go_package = "ipex/x/subnet/types";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

enum SubnetStatus {
  // Initial state, for freshly added subnets
  SUBNET_STATUS_INITIAL = 0;
  // When subnet got initial 
  SUBNET_STATUS_READY = 1; 
  // When ownership verification failed in certaing amount of blocks
  SUBNET_STATUS_REJECTED = 2;
  //When subnet is 
  SUBNET_STATUS_LEASED = 3;
}


message Subnet {
  uint64 id = 1;
  google.protobuf.Timestamp createdAt = 2 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  uint64 networkAddress = 3; 
  uint64 mask = 4; 
  SubnetStatus status = 5; 

  uint64 ownerOrgId = 6; 
  uint64 userOrgId = 7; 

  // Geofeed
  string country = 8; 
  string region = 9;
  string city = 10;
  string postalCode = 11;
  bool publishInGeofeed = 12;
  bool allowLesseeGeoChange = 13; 
  google.protobuf.Timestamp geoDetailsChangedAt = 14 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp geoVerifAttemptedAt = 15 [(gogoproto.stdtime) = true]; 
  bool traceGeoVerified =16;

  // RIR details
  string rir = 17; 
  string rirOwnerOrgId = 18; 
  string rirOwnerOrgName = 19; 
  string rirAbuseEmail = 20; 
  string rirAllocationType = 21;
  bool rirRecordValid = 22; 
  google.protobuf.Timestamp rirSyncedAt = 23 [(gogoproto.stdtime) = true]; 


  // RPKI
  uint64 originAsn = 24; 
  google.protobuf.Timestamp originTransferRequestedAt = 25 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp rpkiValidityChangedAt = 26 [(gogoproto.stdtime) = true]; 
  bool rpkiOriginValid = 27;
  google.protobuf.Timestamp rpkiLastSyncedAt = 28 [(gogoproto.stdtime) = true]; 
  // Origin presence in blocklists
  
  google.protobuf.Timestamp updatedAt = 29 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}
