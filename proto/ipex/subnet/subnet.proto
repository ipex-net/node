syntax = "proto3";
package ipex.subnet;

option go_package = "ipex/x/subnet/types";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

enum SubnetStatus {
  // Initial state, for freshly added subnets
  SUBNET_STATUS_INITIAL = 0;
  // When subnet got initial 
  SUBNET_STATUS_READY = 1; 
  // When ownership verification failed in certaing amount of blocks
  SUBNET_STATUS_REJECTED = 2;
  //When subnet is 
  SUBNET_STATUS_LEASED = 3;
}

enum Rir {
  RIPE = 0;
  ARIN = 1;
  //LACNIC = 2;
  //AFRINIC = 3;
  //APNIC = 4;
}

message Subnet {
  uint64 id = 1;
  google.protobuf.Timestamp createdAt = 2 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  uint64 networkAddress = 3; 
  uint64 mask = 4; 
  SubnetStatus status = 5; 

  string country = 6; 
  string region = 7;
  string city = 8;
  string postalCode = 9;
  bool geoChangeRequested = 10; 
  google.protobuf.Timestamp geoChangeRequestedAt = 11 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp geoChangeFulfilledAt = 12 [(gogoproto.stdtime) = true]; 

  string geofeedUrl = 13; 
  google.protobuf.Timestamp geofeedSyncedAt = 14 [(gogoproto.stdtime) = true]; 

  Rir rir = 15; 

  string rirOwnerOrgId = 16; 
  string rirOwnerOrgName = 17; 
  string rirAbuseEmail = 18; 
  string rirAllocationType = 19;
  bool rirRecordValid = 20; 
  google.protobuf.Timestamp rirSyncAttemptedAt = 21 [(gogoproto.stdtime) = true]; 

  uint64 ownerOrgId = 22; 
  uint64 userOrgId = 23; 

  uint64 origin = 24; 
  bool originTransferRequested = 25; 
  google.protobuf.Timestamp originTransferRequestedAt = 26 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp originTransferFulfilledAt = 27 [(gogoproto.stdtime) = true]; 

  string irrOrigin = 28; 
  string irrMntBy = 29; 
  google.protobuf.Timestamp irrCreatedAt = 30 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp irrModifiedAt = 31 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp irrSyncedAt = 32 [(gogoproto.stdtime) = true]; 
  bool irrOriginExists = 33;

  string rpkiOrigin = 34; 
  bool rpkiOriginExists = 35;
  google.protobuf.Timestamp rpkiSyncedAt = 36 [(gogoproto.stdtime) = true]; 
  
  google.protobuf.Timestamp updatedAt = 37 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];

  bool abuseEmailDomainVerified = 38;
  google.protobuf.Timestamp abuseEmailDomainVerifiedAt = 39 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp abuseEmailDomainVerifAttemptedAt = 40 [(gogoproto.stdtime) = true];
}
