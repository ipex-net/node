syntax = "proto3";
package ipex.subnet;

option go_package = "ipex/x/subnet/types";

enum SubnetStatus {
  // Initial state, for freshly added subnets
  SUBNET_STATUS_INITIAL = 0;
  // When ownership is verified
  SUBNET_STATUS_VERIFIED = 1; 
  // When ownership verification failed in certaing amount of blocks
  SUBNET_STATUS_ERROR = 2;
}

enum Rir {
  RIPE = 0;
  ARIN = 1;
  LACNIC = 2;
  AFRINIC = 3;
  APNIC = 4;
}

message Subnet {
  uint64 id = 1;
  uint64 creationBlock = 2; 
  uint64 networkAddress = 3; 
  uint64 mask = 4; 
  SubnetStatus status = 5; 

  string country = 6; 
  bool countryChangeRequested = 7; 
  uint64 countryChangeRequestedBlock = 8; 
  uint64 countryChangedBlock = 9; 
  string geofeedUrl = 10; 
  uint64 geofeedSyncBlock = 11; 

  Rir rir = 12; 
  string rirOwnerOrg = 13; 
  string rirAbuseEmail = 14; 
  uint64 rirAllocationType = 15; 
  uint64 rirSyncBlock = 16; 

  uint64 ownerOrgId = 17; 
  uint64 userOrgId = 18; 

  string origin = 19; 
  bool originTransferRequested = 20; 
  uint64 originTransferRequestedBlock = 21; 
  uint64 originTransferedBlock = 22; 

  string irrOrigin = 23; 
  string irrMntBy = 24; 
  string irrCreated = 25; 
  string irrModified = 26; 
  uint64 irrSyncBlock = 27; 
  string rpkiOrigin = 28; 
  uint64 rpkiSyncBlock = 29; 
  
}
