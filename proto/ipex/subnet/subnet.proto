syntax = "proto3";
package ipex.subnet;

option go_package = "ipex/x/subnet/types";

enum SubnetStatus {
  // Initial state, for freshly added subnets
  SUBNET_STATUS_INITIAL = 0;
  // When ownership is verified
  SUBNET_STATUS_READY = 1; 
  // When ownership verification failed in certaing amount of blocks
  SUBNET_STATUS_ERROR = 2;
  //When subnet is 
  SUBNET_STATUS_LEASED = 3;
}

enum Rir {
  RIPE = 0;
  ARIN = 1;
  LACNIC = 2;
  AFRINIC = 3;
  APNIC = 4;
}

message Subnet {
  uint64 id = 1;
  uint64 creationBlock = 2; 
  uint64 networkAddress = 3; 
  uint64 mask = 4; 
  SubnetStatus status = 5; 

  string country = 6; 
  string region = 7;
  string city = 8;
  string postalCode = 9;
  bool geoChangeRequested = 10; 
  uint64 geoChangeRequestedBlock = 11; 
  uint64 geoChangedBlock = 12; 

  string geofeedUrl = 13; 
  uint64 geofeedSyncBlock = 14; 

  Rir rir = 15; 

  string rirOwnerOrg = 16; 
  string rirAbuseEmail = 17; 
  uint64 rirAllocationType = 18; 
  uint64 rirSyncBlock = 19; 

  uint64 ownerOrgId = 20; 
  uint64 userOrgId = 21; 

  uint64 origin = 22; 
  bool originTransferRequested = 23; 
  uint64 originTransferRequestedBlock = 24; 
  uint64 originTransferedBlock = 25; 

  string irrOrigin = 26; 
  string irrMntBy = 27; 
  string irrCreated = 28; 
  string irrModified = 29; 
  uint64 irrSyncBlock = 30; 
  string rpkiOrigin = 31; 
  uint64 rpkiSyncBlock = 32; 
  
}
