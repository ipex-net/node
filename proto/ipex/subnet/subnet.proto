syntax = "proto3";
package ipex.subnet;

option go_package = "ipex/x/subnet/types";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

enum SubnetStatus {
  // Initial state, for freshly added subnets
  SUBNET_STATUS_INITIAL = 0;
  // When subnet got initial 
  SUBNET_STATUS_READY = 1; 
  // When ownership verification failed in certaing amount of blocks
  SUBNET_STATUS_REJECTED = 2;
  //When subnet is 
  SUBNET_STATUS_LEASED = 3;
}


message Subnet {
  uint64 id = 1;
  google.protobuf.Timestamp createdAt = 2 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  uint64 networkAddress = 3; 
  uint64 mask = 4; 
  SubnetStatus status = 5; 

  uint64 ownerOrgId = 6; 
  uint64 userOrgId = 7; 

  // Geofeed
  string country = 8; 
  string region = 9;
  string city = 10;
  string postalCode = 11;
  bool publishInGeofeed = 12;
  google.protobuf.Timestamp geoDetailsChangedAt = 13 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp geoVerifAttemptedAt = 14 [(gogoproto.stdtime) = true]; 
  bool traceGeoVerified = 15;

  // RIR details
  string rir = 16; 
  string rirOwnerOrgId = 17; 
  string rirOwnerOrgName = 18; 
  string rirAbuseEmail = 19; 
  string rirAllocationType = 20;
  bool rirRecordValid = 21; 
  google.protobuf.Timestamp rirSyncedAt = 22 [(gogoproto.stdtime) = true]; 


  // RPKI
  uint64 originAsn = 23; 
  google.protobuf.Timestamp originTransferRequestedAt = 24 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp rpkiValidityChangedAt = 25 [(gogoproto.stdtime) = true]; 
  bool rpkiOriginValid = 26;
  google.protobuf.Timestamp rpkiLastSyncedAt = 27 [(gogoproto.stdtime) = true]; 

  // Ownership verification through rDNS or RIR remarks record
  bool ownershipVerified = 28;
  google.protobuf.Timestamp ownershipVerifChangedAt = 29 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp ownershipVerifLastAttemptedAt = 30 [(gogoproto.stdtime) = true];

  google.protobuf.Timestamp updatedAt = 31 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}
