syntax = "proto3";
package ipex.subnet;

option go_package = "ipex/x/subnet/types";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

enum SubnetStatus {
  // Initial state, for freshly added subnets
  SUBNET_STATUS_INITIAL = 0;
  // When ownership is verified
  SUBNET_STATUS_READY = 1; 
  // When ownership verification failed in certaing amount of blocks
  SUBNET_STATUS_ERROR = 2;
  //When subnet is 
  SUBNET_STATUS_LEASED = 3;
}

enum Rir {
  RIPE = 0;
  ARIN = 1;
  LACNIC = 2;
  AFRINIC = 3;
  APNIC = 4;
}

message Subnet {
  uint64 id = 1;
  google.protobuf.Timestamp createdAt = 2 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  uint64 networkAddress = 3; 
  uint64 mask = 4; 
  SubnetStatus status = 5; 

  string country = 6; 
  string region = 7;
  string city = 8;
  string postalCode = 9;
  bool geoChangeRequested = 10; 
  google.protobuf.Timestamp geoChangeRequestedAt = 11 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp geoChangeFulfilledAt = 12 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 

  string geofeedUrl = 13; 
  google.protobuf.Timestamp geofeedSyncedAt = 14 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 

  Rir rir = 15; 

  string rirOwnerOrg = 16; 
  string rirAbuseEmail = 17; 
  uint64 rirAllocationType = 18; 
  google.protobuf.Timestamp rirSyncedAt = 19 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 

  uint64 ownerOrgId = 20; 
  uint64 userOrgId = 21; 

  uint64 origin = 22; 
  bool originTransferRequested = 23; 
  google.protobuf.Timestamp originTransferRequestedAt = 24 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp originTransferFulfilledAt = 25 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 

  string irrOrigin = 26; 
  string irrMntBy = 27; 
  google.protobuf.Timestamp irrCreatedAt = 28 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp irrModifiedAt = 29 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  google.protobuf.Timestamp irrSyncedAt = 30 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  string rpkiOrigin = 31; 
  google.protobuf.Timestamp rpkiSyncedAt = 32 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  
  google.protobuf.Timestamp updatedAt = 33 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}
