syntax = "proto3";
package ipex.subnet;

option go_package = "ipex/x/subnet/types";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

enum SubnetStatus {
  // Initial state, for freshly added subnets
  SUBNET_STATUS_UNSPECIFIED = 0;
  SUBNET_STATUS_INITIAL = 1;
  SUBNET_STATUS_READY = 2; 
  SUBNET_STATUS_REJECTED = 3;
  SUBNET_STATUS_LEASED = 4;
}


message Subnet {
  uint64 id = 1;
  google.protobuf.Timestamp createdAt = 2 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false]; 
  uint64 networkAddress = 3; 
  uint64 mask = 4; 
  SubnetStatus status = 5; 

  uint64 ownerOrgId = 6; 
  uint64 userOrgId = 7; 

  // Geofeed
  string country = 8; 
  string region = 9;
  string city = 10;
  string postalCode = 11;
  bool publishInGeofeed = 12;
  google.protobuf.Timestamp geoDetailsChangedAt = 13 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp geoVerifAttemptedAt = 14 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp geoDbVerifAttemptedAt = 15 [(gogoproto.stdtime) = true]; 
  bool traceGeoVerified = 16;
  bool geoDbRecordVerified = 17;
  bool allowUserGeoChange = 18;

  // RIR details
  string rir = 19; 
  string rirOwnerOrgId = 20; 
  string rirOwnerOrgName = 21; 
  string rirAbuseEmail = 22; 
  string rirAllocationType = 23;
  bool rirRecordValid = 24; 
  google.protobuf.Timestamp rirSyncedAt = 25 [(gogoproto.stdtime) = true]; 


  // RPKI
  uint64 originAsn = 26; 
  google.protobuf.Timestamp originTransferRequestedAt = 27 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp rpkiValidityChangedAt = 28 [(gogoproto.stdtime) = true]; 
  bool rpkiOriginValid = 29;
  google.protobuf.Timestamp rpkiLastSyncedAt = 30 [(gogoproto.stdtime) = true]; 
  bool allowUserASNDROPOriginTransfer = 31;
  bool originCheckPending = 32;
  bool userRequestedASNDROPOriginTransfer = 33;

  // Ownership verification through rDNS or RIR remarks record
  bool ownershipVerified = 34;
  google.protobuf.Timestamp ownershipVerifChangedAt = 35 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp ownershipVerifLastAttemptedAt = 36 [(gogoproto.stdtime) = true];

  google.protobuf.Timestamp updatedAt = 37 [(gogoproto.stdtime) = true, (gogoproto.nullable) = false];
}
