syntax = "proto3";

package ipex.abuse;

import "amino/amino.proto";
import "gogoproto/gogo.proto";
import "google/api/annotations.proto";
import "cosmos/base/query/v1beta1/pagination.proto";
import "ipex/abuse/params.proto";
import "ipex/abuse/complaint.proto";

option go_package = "ipex/x/abuse/types";

// Query defines the gRPC querier service.
service Query {
  
  // Parameters queries the parameters of the module.
  rpc Params (QueryParamsRequest) returns (QueryParamsResponse) {
    option (google.api.http).get = "/ipex/abuse/params";
  
  }
  
  // Queries a list of Complaint items.
  rpc Complaint    (QueryGetComplaintRequest) returns (QueryGetComplaintResponse) {
    option (google.api.http).get = "/ipex/abuse/complaint/{id}";
  
  }
  rpc ComplaintAll (QueryAllComplaintRequest) returns (QueryAllComplaintResponse) {
    option (google.api.http).get = "/ipex/abuse/complaint";
  
  }
  
  // Queries a list of ComplaintBySubnet items.
  rpc ComplaintBySubnet (QueryComplaintBySubnetRequest) returns (QueryComplaintBySubnetResponse) {
    option (google.api.http).get = "/ipex/abuse/complaint_by_subnet/{subnetId}";
  
  }
  
  // Queries a list of ComplaintByLease items.
  rpc ComplaintByLease (QueryComplaintByLeaseRequest) returns (QueryComplaintByLeaseResponse) {
    option (google.api.http).get = "/ipex/abuse/complaint_by_lease/{leaseId}";
  
  }
  
  // Queries a list of ComplaintByLessee items.
  rpc ComplaintByLessee (QueryComplaintByLesseeRequest) returns (QueryComplaintByLesseeResponse) {
    option (google.api.http).get = "/ipex/abuse/complaint_by_lessee/{lesseeOrgId}";
  
  }
  
  // Queries a list of ComplaintByLessor items.
  rpc ComplaintByLessor (QueryComplaintByLessorRequest) returns (QueryComplaintByLessorResponse) {
    option (google.api.http).get = "/ipex/abuse/complaint_by_lessor/{lessorOrgId}";
  
  }
}
// QueryParamsRequest is request type for the Query/Params RPC method.
message QueryParamsRequest {}

// QueryParamsResponse is response type for the Query/Params RPC method.
message QueryParamsResponse {
  
  // params holds all the parameters of this module.
  Params params = 1 [(gogoproto.nullable) = false, (amino.dont_omitempty) = true];
}

message QueryGetComplaintRequest {
  uint64 id = 1;
}

message QueryGetComplaintResponse {
  Complaint complaint = 1 [(gogoproto.nullable) = false];
}

message QueryAllComplaintRequest {
  cosmos.base.query.v1beta1.PageRequest pagination = 1;
}

message QueryAllComplaintResponse {
  repeated Complaint                              complaint  = 1 [(gogoproto.nullable) = false];
           cosmos.base.query.v1beta1.PageResponse pagination = 2;
}

message QueryComplaintBySubnetRequest {
  uint64 subnetId = 1;
}

message QueryComplaintBySubnetResponse {}

message QueryComplaintByLeaseRequest {
  uint64 leaseId = 1;
}

message QueryComplaintByLeaseResponse {}

message QueryComplaintByLesseeRequest {
  uint64 lesseeOrgId = 1;
}

message QueryComplaintByLesseeResponse {}

message QueryComplaintByLessorRequest {
  uint64 lessorOrgId = 1;
}

message QueryComplaintByLessorResponse {}

