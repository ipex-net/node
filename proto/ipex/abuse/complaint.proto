syntax = "proto3";
package ipex.abuse;

option go_package = "ipex/x/abuse/types";
import "google/protobuf/timestamp.proto";
import "gogoproto/gogo.proto";

// Main complaint structure
message Complaint {
  uint64 id = 1; 
  uint64 leaseId = 2; 
  uint64 subnetId = 3; 
  uint64 lessorOrgId = 4; 
  uint64 lesseeOrgId = 5; 
  AbuseType abuseType = 6;  
  google.protobuf.Timestamp incidentTime = 7 [(gogoproto.stdtime) = true];   
  uint64 sourceIp = 8;       // IP in decimal format
  string lessorTicketRef = 9; 
  string evidenceHash = 10;  // IPFS hash for details
  string summary = 11;       // Initial complaint summary
  ComplaintState state = 12;
  google.protobuf.Timestamp submittedAt = 13 [(gogoproto.stdtime) = true]; 
  google.protobuf.Timestamp resolutionDeadline = 14 [(gogoproto.stdtime) = true];
  
  // Thread of all messages
  repeated ThreadMessage thread = 15;
  
  // Tracking fields
  google.protobuf.Timestamp lastActivityAt = 16 [(gogoproto.stdtime) = true];
  google.protobuf.Timestamp closedAt = 17 [(gogoproto.stdtime) = true]; // Only set when closed
  bool resolutionFailed = 18;
}

// Unified message structure for the thread
message ThreadMessage {
  MessageType messageType = 1;
  string content = 2;
  string evidenceHash = 3;
  google.protobuf.Timestamp sentAt = 4 [(gogoproto.stdtime) = true];
}


// Type of message in thread
enum MessageType {
  MESSAGE_TYPE_UNSPECIFIED = 0;
  MESSAGE_TYPE_LESSEE_RESPONSE = 1;
  MESSAGE_TYPE_LESSOR_FOLLOWUP = 2;
}

// Abuse types based on real-world data
enum AbuseType {
  ABUSE_TYPE_UNSPECIFIED = 0;
  ABUSE_TYPE_COPYRIGHT_DMCA = 1;   
  ABUSE_TYPE_SPAM = 2;             
  ABUSE_TYPE_BRUTEFORCE = 3;       
  ABUSE_TYPE_MALWARE = 4;           
  ABUSE_TYPE_PORT_SCANNING = 5;     
  ABUSE_TYPE_DOS_DDOS = 6;         
  ABUSE_TYPE_PHISHING_FRAUD = 7;    
  ABUSE_TYPE_HACKING = 8;           
  ABUSE_TYPE_VIOLENCE_HATE_CSAM = 9;
  ABUSE_TYPE_OTHER = 10;
}

// Complaint states
enum ComplaintState {
  STATE_UNSPECIFIED = 0;
  STATE_SUBMITTED = 1;
  STATE_RESPONDED = 2;
  STATE_AWAITING_RESPONSE = 3;
  STATE_CLOSED = 4;
}